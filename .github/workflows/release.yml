name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release\stremio-tr-sources" -Force
          Copy-Item -Path "dist", "admin", "data", "scripts", "Kur-Otomatik-Baslat.cmd", "Stremio-TR-Baslat.cmd", "Durum-Kontrol.cmd", "Durdur.cmd", "Kaldir-Otomatik-Baslat.cmd", "package.json", "package-lock.json", "README.md", "LICENSE" -Destination "release\stremio-tr-sources" -Recurse -Force
          Set-Location "release\stremio-tr-sources"
          npm ci --omit=dev
          Set-Location ".."
          Compress-Archive -Path "stremio-tr-sources" -DestinationPath "stremio-tr-sources-windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stremio TR Sources ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/stremio-tr-sources-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
